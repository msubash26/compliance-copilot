[project]
name = "regops-evals"
version = "0.1.0"
description = "Golden set, retrieval benchmark and agent eval suite for the compliance copilot"
readme = "README.md"
authors = [
    { name = "Subash M", email = "msubash26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "regops-retrieval",
    # Day 8: the agent eval drives the agents. `regops-agents` does not depend on
    # this package, so the edge is one-way and `uv` resolves it without a cycle.
    "regops-agents",
    "duckdb>=1.5",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.scripts]
regops-evals = "regops_evals.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
