repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^docker/docker-compose\.override\.yml$
      # The override carries Compose's `!override` tag, which a generic YAML parser
      # cannot construct. --unsafe validates syntax only and tolerates unknown tags.
      # `docker compose config` is the real validator for these files — see ADR-007.
      - id: check-yaml
        name: check-yaml (compose — unknown tags allowed)
        args: [--unsafe]
        files: ^docker/docker-compose\.override\.yml$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
